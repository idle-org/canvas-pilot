[package]
name = "canvas-pilot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen layout design, geometry import and reviewed device control"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"

[features]
default = ["vendor_formats"]
vendor_formats = ["dep:craft-dwg", "dep:deckcraft-pptx", "dep:deckcraft-model", "dep:deckcraft-geom", "dep:figcraft-format", "dep:figcraft-doc", "dep:figcraft-geom"]
# Use with --no-default-features to exclude the optional codecs and their dependencies.
no_proprietary = []

[dependencies]
rust-i18n = "4.2.4"
sys-locale = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
craft-dxf = { git = "https://github.com/storytold/craft-libs", rev = "79e97b6febcb62de406e5bcf5a724bd3f7333065" }
craft-dwg = { git = "https://github.com/storytold/craft-libs", rev = "79e97b6febcb62de406e5bcf5a724bd3f7333065", optional = true }
deckcraft-pptx = { version = "=0.6.1", optional = true }
deckcraft-model = { version = "=0.6.1", optional = true }
deckcraft-geom = { version = "=0.6.1", optional = true }
figcraft-format = { version = "=0.5.1", optional = true }
figcraft-doc = { version = "=0.5.1", optional = true }
figcraft-geom = { version = "=0.5.1", optional = true }
roxmltree = "0.20"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.15"
svgtypes = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
flate2 = "1"
csv = "1.4"
tempfile = "3"
directories = "6"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[build-dependencies]
winresource = "0.1.17"
